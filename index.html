// ════════════════ DÉBUT HTML ════════════════

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi des arrêts de production</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- ════════════════ DÉBUT CSS ════════════════ -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

  body { background: #1e1e2e; color: #eee; padding: 20px; }

  h1 { text-align: center; margin-bottom: 20px; color: #fff; }

  .barre-haut { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }

  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: bold; color: #fff;
  }
  .btn-ajouter { background: #2f9e44; }
  .btn-export { background: #1971c2; }

  #conteneur {
    display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
  }

  .module {
    background: #2b2b3d; border-radius: 12px; padding: 15px;
    width: 380px; min-width: 300px; max-width: 800px;
    height: 520px; min-height: 300px;
    resize: both; overflow: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px;
  }
  .module.drag-over { outline: 2px dashed #1971c2; }

  .poignee { cursor: grab; color: #888; font-size: 18px; float: left; margin-right: 8px; }

  h2 { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .nom {
    flex: 1; background: #1e1e2e; border: 1px solid #444; color: #fff;
    border-radius: 6px; padding: 6px; font-size: 15px;
  }

  .etat { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .etat.en-marche { background: #2f9e44; }
  .etat.en-panne { background: #e03131; }

  .compteur {
    font-size: 34px; text-align: center; font-family: monospace;
    background: #1e1e2e; border-radius: 8px; padding: 8px; color: #ffd43b;
  }

  .boutons { display: flex; gap: 10px; }
  .btn-marche { flex: 1; background: #2f9e44; }
  .btn-panne { flex: 1; background: #e03131; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .zone-cause { display: flex; gap: 8px; }
  .cause {
    flex: 1; background: #1e1e2e; border: 1px solid #444; color: #fff;
    border-radius: 6px; padding: 6px;
  }
  .btn-valider { background: #1971c2; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #444; padding: 4px; text-align: center; }
  th { background: #1e1e2e; }

  .btn-suppr { background: #862e2e; align-self: center; }
</style>
<!-- ════════════════ FIN CSS ════════════════ -->

</head>
<body>

<h1>⚙️ Suivi des arrêts de production</h1>

<div class="barre-haut">
  <button class="btn-ajouter" onclick="ajouterModule()">➕ Ajouter un module</button>
  <button class="btn-export" onclick="exporterExcel()">📊 Exporter Excel</button>
</div>

<div id="conteneur"></div>

<!-- ════════════════ DÉBUT JAVASCRIPT ════════════════ -->
<script>
let compteur = 1;

function ajouterModule(nom = "Module " + compteur, data = null) {
  compteur++;

  const mod = document.createElement("div");
  mod.className = "module";
  mod._secondes = 0;
  mod._enPanne = false;
  mod._debutPanne = null;

  mod.innerHTML = `
    <h2>
      <span class="poignee" draggable="true">⠿</span>
      <input class="nom" value="${nom}">
      <span class="etat en-marche">En marche</span>
    </h2>
    <div class="compteur">00:00:00</div>
    <div class="boutons">
      <button class="btn-marche" disabled>En marche</button>
      <button class="btn-panne">En panne</button>
    </div>
    <div class="zone-cause">
      <input class="cause" placeholder="Cause de l'arrêt...">
      <button class="btn-valider">Valider</button>
    </div>
    <table>
      <thead>
        <tr><th>Arrêt n°</th><th>Début</th><th>Fin</th><th>Durée</th><th>Cause</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-suppr">🗑 Supprimer</button>
  `;

  const etat = mod.querySelector(".etat");
  const compteurEl = mod.querySelector(".compteur");
  const btnMarche = mod.querySelector(".btn-marche");
  const btnPanne = mod.querySelector(".btn-panne");
  const causeInput = mod.querySelector(".cause");
  const btnValider = mod.querySelector(".btn-valider");
  const tbody = mod.querySelector("tbody");
  let nbArrets = 0;

  function majCompteur() {
    const h = String(Math.floor(mod._secondes / 3600)).padStart(2, "0");
    const m = String(Math.floor((mod._secondes % 3600) / 60)).padStart(2, "0");
    const s = String(mod._secondes % 60).padStart(2, "0");
    compteurEl.textContent = `${h}:${m}:${s}`;
  }

  function formater(date) {
    return date.toLocaleTimeString("fr-FR", { hour12: false });
  }

  function duree(sec) {
    const h = String(Math.floor(sec / 3600)).padStart(2, "0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  // ── En panne : le chrono DÉMARRE ──
  btnPanne.onclick = () => {
    mod._enPanne = true;
    mod._debutPanne = new Date();
    etat.textContent = "En panne";
    etat.className = "etat en-panne";
    btnPanne.disabled = true;
    btnMarche.disabled = false;
    causeInput.value = "";
  };

  // ── En marche : le chrono S'ARRÊTE et on enregistre l'arrêt ──
  btnMarche.onclick = () => {
    if (!mod._enPanne) return;
    mod._enPanne = false;
    const fin = new Date();
    const dureeSec = Math.floor((fin - mod._debutPanne) / 1000);
    mod._secondes += dureeSec;

    nbArrets++;
    const tr = document.createElement("tr");
    [nbArrets, formater(mod._debutPanne), formater(fin), duree(dureeSec), causeInput.value || "-"]
      .forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    tbody.appendChild(tr);

    mod._debutPanne = null;
    etat.textContent = "En marche";
    etat.className = "etat en-marche";
    btnMarche.disabled = true;
    btnPanne.disabled = false;
    causeInput.value = "";
    majCompteur();
    sauvegarder();
  };

  btnValider.onclick = () => {
    // Valider la cause sans changer l'état (optionnel : ajout direct d'une ligne)
    if (mod._enPanne && causeInput.value.trim() !== "") {
      causeInput.style.borderColor = "#2f9e44";
      setTimeout(() => causeInput.style.borderColor = "", 800);
    }
  };

  mod.querySelector(".btn-suppr").onclick = () => {
    if (confirm("Supprimer ce module ?")) {
      mod.remove();
      sauvegarder();
    }
  };

  // ── Glisser-déposer pour réorganiser ──
  const poignee = mod.querySelector(".poignee");
  poignee.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", Array.from(mod.parentNode.children).indexOf(mod));
  });
  mod.addEventListener("dragover", e => { e.preventDefault(); mod.classList.add("drag-over"); });
  mod.addEventListener("dragleave", () => mod.classList.remove("drag-over"));
  mod.addEventListener("drop", e => {
    e.preventDefault();
    mod.classList.remove("drag-over");
    const idx = parseInt(e.dataTransfer.getData("text/plain"));
    const conteneur = document.getElementById("conteneur");
    const modules = Array.from(conteneur.children);
    const deplace = modules[idx];
    if (deplace && deplace !== mod) {
      const rect = mod.getBoundingClientRect();
      const avant = e.clientX < rect.left + rect.width / 2;
      conteneur.insertBefore(deplace, avant ? mod : mod.nextSibling);
      sauvegarder();
    }
  });

  document.getElementById("conteneur").appendChild(mod);

  // ── Restauration de la taille du module ──
  if (data && data.largeur) mod.style.width = data.largeur;
  if (data && data.hauteur) mod.style.height = data.hauteur;

  // ── Restauration de l'état ──
  if (data) {
    mod._secondes = data.secondes || 0;
    nbArrets = Array.isArray(data.arrets) ? data.arrets.length : 0;
    if (data.enPanne && data.debutPanne) {
      mod._enPanne = true;
      mod._debutPanne = new Date(data.debutPanne);
      etat.textContent = "En panne";
      etat.className = "etat en-panne";
      btnPanne.disabled = true;
      btnMarche.disabled = false;
    } else {
      majCompteur();
    }
  }

  // ── Timer global du module ──
  setInterval(() => {
    if (mod._enPanne && mod._debutPanne) {
      const total = mod._secondes + Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
      const h = String(Math.floor(total / 3600)).padStart(2, "0");
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      compteurEl.textContent = `${h}:${m}:${s}`;
    }
  }, 1000);

  majCompteur();
}

// ── Export Excel ──
function exporterExcel() {
  const lignes = [["Module", "Arrêt n°", "Début", "Fin", "Durée", "Cause"]];
  let totalGlobal = 0;

  document.querySelectorAll(".module").forEach(mod => {
    const nom = mod.querySelector(".nom").value;
    let totalMod = 0;
    Array.from(mod.querySelectorAll("tbody tr")).forEach((tr, i) => {
      const cells = Array.from(tr.querySelectorAll("td")).map(td => td.textContent);
      const [h, m, s] = cells[3].split(":").map(Number);
      const dureeSec = h * 3600 + m * 60 + s;
      totalMod += dureeSec;
      lignes.push([nom, ...cells]);
    });
    if (totalMod === 0) lignes.push([nom, "-", "-", "-", "00:00:00", "-"]);
    totalGlobal += totalMod;
    lignes.push([nom, "Total", "", "", duree(totalMod), ""]);
  });

  lignes.push(["TOTAL GÉNÉRAL", "", "", "", duree(totalGlobal), ""]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(lignes);
  ws["!cols"] = [{ wch: 15 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, "Arrêts");
  XLSX.writeFile(wb, "arrets_" + new Date().toLocaleDateString("fr-FR").replace(/\//g, "-") + ".xlsx");
}

// ── Sauvegarde (avec correction du double comptage) ──
function sauvegarder() {
  const data = [];
  document.querySelectorAll(".module").forEach(mod => {
    // Si en panne, on fige le temps écoulé AVANT de sauvegarder
    if (mod._enPanne && mod._debutPanne) {
      mod._secondes += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
      mod._debutPanne = new Date();
    }
    data.push({
      nom: mod.querySelector(".nom").value,
      secondes: mod._secondes,
      enPanne: mod._enPanne,
      debutPanne: mod._debutPanne ? mod._debutPanne.getTime() : null,
      largeur: mod.style.width || "",
      hauteur: mod.style.height || "",
      arrets: Array.from(mod.querySelectorAll("tbody tr")).map(tr =>
        Array.from(tr.querySelectorAll("td")).map(td => td.textContent)
      )
    });
  });
  localStorage.setItem("suiviArrets", JSON.stringify(data));
}

// ── Chargement ──
function charger() {
  const data = JSON.parse(localStorage.getItem("suiviArrets") || "[]");
  if (data.length === 0) {
    ajouterModule();
  } else {
    data.forEach(d => ajouterModule(d.nom, d));
  }
}

charger();

// ── Sauvegarde automatique toutes les 30 secondes ──
setInterval(sauvegarder, 30000);

// ── Sauvegarde à la fermeture de la page ──
window.addEventListener("beforeunload", sauvegarder);
</script>
<!-- ════════════════ FIN JAVASCRIPT ════════════════ -->

</body>
</html>
<!-- ════════════════ FIN HTML ════════════════ -->
