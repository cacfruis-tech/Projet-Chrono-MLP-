<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi des arrêts de production</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
  body { display: flex; flex-direction: column; color: #eee; }
  h1 { text-align: center; padding: 10px 0 6px; font-size: 22px; }
  .barre-haut { display: flex; gap: 10px; justify-content: center; padding-bottom: 10px; }
  button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
           font-size: 14px; font-weight: bold; color: #fff; }
  .btn-ajouter { background: #2f9e44; }
  .btn-export  { background: #1971c2; }

  #tableau { flex: 1; position: relative; overflow: hidden; margin: 0 10px 10px;
             background: repeating-linear-gradient(#26263a 0 1px, transparent 1px 30px),
                         repeating-linear-gradient(90deg, #26263a 0 1px, transparent 1px 30px);
             border-radius: 12px; }

  .module { position: absolute; background: #2b2b3d; border-radius: 12px; padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 8px;
            min-width: 280px; min-height: 260px; }
  .poignee { cursor: grab; color: #888; font-size: 18px; text-align: center;
             background: #1e1e2e; border-radius: 6px; padding: 2px 0; user-select: none; }
  .module.deplace { opacity: .9; box-shadow: 0 10px 25px rgba(0,0,0,.7); }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .nom { flex: 1; background: #1e1e2e; border: 1px solid #444; color: #fff;
         border-radius: 6px; padding: 6px; font-size: 15px; min-width: 0; }
  .suppr { background: #c92a2a; border: none; color: #fff; border-radius: 6px;
           cursor: pointer; padding: 5px 9px; }
  .chrono { font-size: 26px; text-align: center; font-weight: bold; font-family: monospace; }
  .boutons { display: flex; gap: 8px; }
  .btn-marche { flex: 1; background: #2f9e44; padding: 10px 0; }
  .btn-panne  { flex: 1; background: #e03131; padding: 10px 0; }
  .btn-zero   { background: #555; padding: 8px 0; }

  .tableau-arrets { flex: 1; overflow: hidden; border-radius: 8px; }
  table { width: 100%; height: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #444; padding: 4px; text-align: center; }
  th { background: #1e1e2e; }

  .poignee-redim { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px;
                   cursor: nwse-resize;
                   background: linear-gradient(135deg, transparent 40%, #1971c2 40%); }
</style>
</head>
<body>

<h1>📋 Suivi des arrêts de production</h1>
<div class="barre-haut">
  <button class="btn-ajouter" onclick="ajouterModule()">➕ Ajouter un module</button>
  <button class="btn-export" onclick="exporter()">📊 Exporter en Excel</button>
</div>
<div id="tableau"></div>

<script>
const tableau = document.getElementById("tableau");
let compteur = 0;

// ===== Ajouter un module =====
function ajouterModule(nomInitial = "", data = null) {
  compteur++;
  const mod = document.createElement("div");
  mod.className = "module";
  mod._secondes = data ? data.secondes : 0;
  mod._enPanne = data ? data.enPanne : false;
  mod._debutPanne = null;

  const posX = data ? data.posX : 20 + (compteur - 1) * 40;
  const posY = data ? data.posY : 20 + (compteur - 1) * 40;
  mod.style.left = posX + "px";
  mod.style.top = posY + "px";
  mod.style.width = data ? data.largeur : "320px";
  mod.style.height = data ? data.hauteur : "340px";

  mod.innerHTML = `
    <div class="poignee">⠿⠿⠿</div>
    <h2>
      <input class="nom" placeholder="Nom du module" value="${nomInitial || "Module " + compteur}">
      <span class="etat"></span>
      <button class="suppr">✖</button>
    </h2>
    <div class="chrono">00:00:00</div>
    <div class="boutons">
      <button class="btn-marche">En marche</button>
      <button class="btn-panne">En panne</button>
    </div>
    <button class="btn-zero">↺ Remettre le chrono à zéro</button>
    <div class="tableau-arrets">
      <table>
        <thead><tr><th>Début</th><th>Fin</th><th>Durée</th><th>Cause</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="poignee-redim"></div>`;

  tableau.appendChild(mod);

  // ----- Boutons -----
  const btnMarche = mod.querySelector(".btn-marche");
  const btnPanne = mod.querySelector(".btn-panne");
  const etat = mod.querySelector(".etat");
  const chrono = mod.querySelector(".chrono");

  function majAffichage() {
    if (mod._enPanne) {
      chrono.textContent = fmt(mod._secondes + Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000));
      chrono.style.color = "#ff6b6b";
      etat.textContent = "EN PANNE"; etat.className = "etat";
      etat.style.background = "#e03131";
    } else {
      chrono.textContent = fmt(mod._secondes);
      chrono.style.color = "#fff";
      etat.textContent = "EN MARCHE"; etat.className = "etat en-marche";
    }
  }

  btnMarche.onclick = () => {
    if (mod._enPanne) {
      const duree = Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
      mod._secondes += duree;
      const now = new Date();
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${mod._debutPanne.toLocaleTimeString("fr-FR")}</td>
        <td>${now.toLocaleTimeString("fr-FR")}</td>
        <td>${fmt(duree)}</td>
        <td contenteditable></td><td style="display:none"></td>`;
      mod.querySelector("tbody").appendChild(tr);
      mod._enPanne = false; mod._debutPanne = null;
      majAffichage(); sauvegarder();
    }
  };

  btnPanne.onclick = () => {
    if (!mod._enPanne) {
      mod._enPanne = true; mod._debutPanne = new Date();
      majAffichage(); sauvegarder();
    }
  };

  mod.querySelector(".btn-zero").onclick = () => {
    mod._secondes = 0; mod._enPanne = false; mod._debutPanne = null;
    mod.querySelector("tbody").innerHTML = "";
    majAffichage(); sauvegarder();
  };

  mod.querySelector(".suppr").onclick = () => {
    if (confirm("Supprimer ce module ?")) { mod.remove(); sauvegarder(); }
  };

  mod.querySelector(".nom").addEventListener("input", sauvegarder);

  // ----- Déplacement -----
  const poignee = mod.querySelector(".poignee");
  poignee.addEventListener("mousedown", e => {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startL = mod.offsetLeft, startT = mod.offsetTop;
    mod.classList.add("deplace");

    function bouger(ev) {
      let l = startL + ev.clientX - startX;
      let t = startT + ev.clientY - startY;
      l = Math.max(0, Math.min(l, tableau.clientWidth - mod.offsetWidth));
      t = Math.max(0, Math.min(t, tableau.clientHeight - mod.offsetHeight));
      mod.style.left = l + "px"; mod.style.top = t + "px";
    }
    function relacher() {
      document.removeEventListener("mousemove", bouger);
      document.removeEventListener("mouseup", relacher);
      mod.classList.remove("deplace");
      sauvegarder();
    }
    document.addEventListener("mousemove", bouger);
    document.addEventListener("mouseup", relacher);
  });

  // ----- Redimensionnement -----
  const redim = mod.querySelector(".poignee-redim");
  redim.addEventListener("mousedown", e => {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startW = mod.offsetWidth, startH = mod.offsetHeight;

    function bouger(ev) {
      mod.style.width = Math.max(280, startW + ev.clientX - startX) + "px";
      mod.style.height = Math.max(260, startH + ev.clientY - startY) + "px";
    }
    function relacher() {
      document.removeEventListener("mousemove", bouger);
      document.removeEventListener("mouseup", relacher);
      sauvegarder();
    }
    document.addEventListener("mousemove", bouger);
    document.addEventListener("mouseup", relacher);
  });

  majAffichage();
  return mod;
}

function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

// ===== Export Excel =====
function exporter() {
  const lignes = [["Module", "Début", "Fin", "Durée", "Cause", "Temps total d'arrêt"]];
  let totalGlobal = 0;

  document.querySelectorAll(".module").forEach(mod => {
    let secondes = mod._secondes;
    if (mod._enPanne && mod._debutPanne) {
      secondes += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
    }
    totalGlobal += secondes;
    const nom = mod.querySelector(".nom").value;

    const trs = mod.querySelectorAll("tbody tr");
    if (trs.length === 0) {
      lignes.push([nom, "", "", "", "", fmt(secondes)]);
    } else {
      trs.forEach((tr, i) => {
        const tds = tr.querySelectorAll("td");
        lignes.push([i === 0 ? nom : "", tds[0].textContent, tds[1].textContent,
                     tds[2].textContent, tds[3].textContent, i === 0 ? fmt(secondes) : ""]);
      });
    }
    lignes.push(["", "", "", "", "", ""]);
  });

  lignes.push(["TOTAL GÉNÉRAL", "", "", "", "", fmt(totalGlobal)]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(lignes);
  ws["!cols"] = [{ wch: 15 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 25 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws, "Arrêts");
  XLSX.writeFile(wb, "arrets_" + new Date().toLocaleDateString("fr-FR").replace(/\//g, "-") + ".xlsx");
}

// ===== Sauvegarde / Chargement =====
function sauvegarder() {
  const data = [];
  document.querySelectorAll(".module").forEach(mod => {
    if (mod._enPanne && mod._debutPanne) {
      mod._secondes += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
      mod._debutPanne = new Date();
    }
    data.push({
      nom: mod.querySelector(".nom").value,
      secondes: mod._secondes,
      enPanne: mod._enPanne,
      posX: parseInt(mod.style.left),
      posY: parseInt(mod.style.top),
      largeur: mod.style.width,
      hauteur: mod.style.height,
      arrets: Array.from(mod.querySelectorAll("tbody tr")).map(tr =>
        Array.from(tr.querySelectorAll("td")).slice(0, 4).map(td => td.textContent))
    });
  });
  localStorage.setItem("suiviArrets", JSON.stringify(data));
}

function charger() {
  const data = JSON.parse(localStorage.getItem("suiviArrets") || "[]");
  if (data.length === 0) ajouterModule();
  else data.forEach(d => ajouterModule(d.nom, d));
}

charger();
setInterval(sauvegarder, 30000);
window.addEventListener("beforeunload", sauvegarder);
</script>

</body>
</html>
