<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi des arrêts de production</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

  body { background: #1e1e2e; color: #eee; padding: 20px; }

  h1 { text-align: center; margin-bottom: 20px; color: #fff; }

  .barre-haut { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }

  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: bold; color: #fff;
  }
  .btn-ajouter { background: #2f9e44; }
  .btn-export { background: #1971c2; }

  #conteneur {
    display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
  }

  .module {
    background: #2b2b3d; border-radius: 12px; padding: 15px;
    width: 380px; min-width: 300px; max-width: 800px;
    height: 520px; min-height: 300px;
    resize: both; overflow: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px;
  }
  .module.drag-over { outline: 2px dashed #1971c2; }

  .poignee { cursor: grab; color: #888; font-size: 18px; float: left; margin-right: 8px; }

  h2 { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .nom {
    flex: 1; background: #1e1e2e; border: 1px solid #444; color: #fff;
    border-radius: 6px; padding: 6px; font-size: 15px;
  }

  .etat { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .etat.en-marche { background: #2f9e44; }
  .etat.en-panne { background: #e03131; }

  .compteur {
    font-size: 34px; text-align: center; font-family: monospace;
    background: #1e1e2e; border-radius: 8px; padding: 8px; color: #ffd43b;
  }

  .boutons { display: flex; gap: 10px; }
  .btn-marche { flex: 1; background: #2f9e44; }
  .btn-panne { flex: 1; background: #e03131; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .zone-cause { display: flex; gap: 8px; }
  .cause {
    flex: 1; background: #1e1e2e; border: 1px solid #444; color: #fff;
    border-radius: 6px; padding: 6px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #444; padding: 4px; text-align: center; }
  th { background: #1e1e2e; }

  .btn-suppr { background: #862e2e; align-self: center; }
</style>
</head>
<body>

<h1>Suivi des arrêts de production</h1>

<div class="barre-haut">
  <button class="btn-ajouter" onclick="ajouterModule()">+ Ajouter un module</button>
  <button class="btn-export" onclick="exporterExcel()">📊 Exporter en Excel</button>
</div>

<div id="conteneur"></div>

<script>
const conteneur = document.getElementById("conteneur");
let moduleDeplace = null;

function duree(s) {
  s = Math.max(0, s);
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return h + ":" + m + ":" + sec;
}

// Création d'un module
function ajouterModule(nom = "Machine " + (conteneur.children.length + 1), data = null) {
  const mod = document.createElement("div");
  mod.className = "module";
  mod.draggable = true;

  mod.innerHTML = `
    <h2>
      <span class="poignee">⠿</span>
      <input class="nom" value="${nom}">
      <span class="etat en-marche">EN MARCHE</span>
    </h2>
    <div class="compteur">00:00:00</div>
    <div class="boutons">
      <button class="btn-marche" disabled>▶ Marche</button>
      <button class="btn-panne">⏸ Panne</button>
    </div>
    <div class="zone-cause">
      <input class="cause" placeholder="Cause de l'arrêt (Entrée pour valider)">
    </div>
    <table>
      <thead>
        <tr><th>Date</th><th>Heure</th><th>Fin</th><th>Durée</th><th>Cause</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-suppr">🗑 Supprimer le module</button>
  `;

  const etat = mod.querySelector(".etat");
  const compteur = mod.querySelector(".compteur");
  const btnMarche = mod.querySelector(".btn-marche");
  const btnPanne = mod.querySelector(".btn-panne");
  const cause = mod.querySelector(".cause");
  const tbody = mod.querySelector("tbody");

  // État interne du chrono
  mod._secondes = 0;
  mod._enPanne = false;
  mod._debutPanne = null;
  mod._ligneEnCours = null;

  // Restauration des données
  if (data) {
    mod._secondes = data.secondes || 0;
    mod._enPanne = data.enPanne || false;
    if (data.debutPanne) mod._debutPanne = new Date(data.debutPanne);
    if (data.largeur) mod.style.width = data.largeur;
    if (data.hauteur) mod.style.height = data.hauteur;
    if (data.arrets) {
      data.arrets.forEach(cells => {
        const tr = document.createElement("tr");
        cells.forEach(c => {
          const td = document.createElement("td");
          td.textContent = c;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
  }

  // Affichage du chrono
  function afficher() {
    let total = mod._secondes;
    if (mod._enPanne && mod._debutPanne) {
      total += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
    }
    compteur.textContent = duree(total);
  }

  // Tick toutes les secondes
  mod._timer = setInterval(afficher, 1000);
  afficher();

  // Passer en panne
  btnPanne.addEventListener("click", () => {
    if (mod._enPanne) return;
    mod._enPanne = true;
    mod._debutPanne = new Date();
    etat.textContent = "EN PANNE";
    etat.className = "etat en-panne";
    btnPanne.disabled = true;
    btnMarche.disabled = false;
    cause.focus();

    // Nouvelle ligne d'arrêt
    const tr = document.createElement("tr");
    const date = new Date();
    tr.innerHTML = `
      <td>${date.toLocaleDateString("fr-FR")}</td>
      <td>${date.toLocaleTimeString("fr-FR")}</td>
      <td>-</td>
      <td>-</td>
      <td>-</td>
    `;
    tbody.appendChild(tr);
    mod._ligneEnCours = tr;
  });

  // Revenir en marche
  btnMarche.addEventListener("click", () => {
    if (!mod._enPanne) return;
    mod._enPanne = false;
    mod._secondes += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
    mod._debutPanne = null;
    etat.textContent = "EN MARCHE";
    etat.className = "etat en-marche";
    btnMarche.disabled = true;
    btnPanne.disabled = false;

    // Finaliser la ligne d'arrêt
    if (mod._ligneEnCours) {
      const tds = mod._ligneEnCours.querySelectorAll("td");
      tds[2].textContent = new Date().toLocaleTimeString("fr-FR");
      tds[3].textContent = duree(mod._secondes - (mod._dureeAvant || 0));
      mod._dureeAvant = mod._secondes;
      mod._ligneEnCours = null;
    }
    afficher();
  });

  // Cause : touche Entrée
  cause.addEventListener("keydown", e => {
    if (e.key === "Enter" && mod._ligneEnCours) {
      const tds = mod._ligneEnCours.querySelectorAll("td");
      tds[4].textContent = cause.value.trim() || "-";
      cause.value = "";
      sauvegarder();
    }
  });

  // Supprimer le module
  mod.querySelector(".btn-suppr").addEventListener("click", () => {
    if (confirm("Supprimer ce module ?")) {
      clearInterval(mod._timer);
      mod.remove();
      sauvegarder();
    }
  });

  // ── Drag & drop pour réorganiser ──
  mod.addEventListener("dragstart", () => { moduleDeplace = mod; });
  mod.addEventListener("dragend", () => {
    moduleDeplace = null;
    document.querySelectorAll(".module").forEach(m => m.classList.remove("drag-over"));
  });
  mod.addEventListener("dragover", e => {
    e.preventDefault();
    if (moduleDeplace && moduleDeplace !== mod) mod.classList.add("drag-over");
  });
  mod.addEventListener("dragleave", () => mod.classList.remove("drag-over"));
  mod.addEventListener("drop", e => {
    e.preventDefault();
    mod.classList.remove("drag-over");
    if (moduleDeplace && moduleDeplace !== mod) {
      conteneur.insertBefore(moduleDeplace, mod);
      sauvegarder();
    }
  });

  conteneur.appendChild(mod);
}

// Export Excel
function exporterExcel() {
  const lignes = [["Module", "Date", "Heure début", "Heure fin", "Durée", "Cause"]];
  let totalGlobal = 0;

  document.querySelectorAll(".module").forEach(mod => {
    const nom = mod.querySelector(".nom").value;
    let totalMod = 0;
    Array.from(mod.querySelectorAll("tbody tr")).forEach(tr => {
      const cells = Array.from(tr.querySelectorAll("td")).map(td => td.textContent);
      const [h, m, s] = cells[3].split(":").map(Number);
      totalMod += h * 3600 + m * 60 + s;
      lignes.push([nom, ...cells]);
    });
    if (totalMod > 0) lignes.push([nom, "Total", "", "", duree(totalMod), ""]);
    totalGlobal += totalMod;
  });

  lignes.push(["TOTAL GÉNÉRAL", "", "", "", duree(totalGlobal), ""]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(lignes);
  ws["!cols"] = [{ wch: 15 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, "Arrêts");
  XLSX.writeFile(wb, "arrets_" + new Date().toLocaleDateString("fr-FR").replace(/\//g, "-") + ".xlsx");
}

// Sauvegarde
function sauvegarder() {
  const data = [];
  document.querySelectorAll(".module").forEach(mod => {
    if (mod._enPanne && mod._debutPanne) {
      mod._secondes += Math.floor((Date.now() - mod._debutPanne.getTime()) / 1000);
      mod._debutPanne = new Date();
    }
    data.push({
      nom: mod.querySelector(".nom").value,
      secondes: mod._secondes,
      enPanne: mod._enPanne,
      debutPanne: mod._debutPanne ? mod._debutPanne.getTime() : null,
      largeur: mod.style.width || "",
      hauteur: mod.style.height || "",
      arrets: Array.from(mod.querySelectorAll("tbody tr")).map(tr =>
        Array.from(tr.querySelectorAll("td")).map(td => td.textContent)
      )
    });
  });
  localStorage.setItem("suiviArrets", JSON.stringify(data));
}

// Chargement
function charger() {
  const data = JSON.parse(localStorage.getItem("suiviArrets") || "[]");
  if (data.length === 0) {
    ajouterModule();
  } else {
    data.forEach(d => ajouterModule(d.nom, d));
  }
}

charger();

// Sauvegarde automatique toutes les 30 secondes
setInterval(sauvegarder, 30000);

// Sauvegarde à la fermeture de la page
window.addEventListener("beforeunload", sauvegarder);
</script>

</body>
</html>
